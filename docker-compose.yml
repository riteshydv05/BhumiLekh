services:

  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    image: land-record-postgres:16-postgis-pgvector
    container_name: land-record-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: land_records
      POSTGRES_USER: land_admin
      POSTGRES_PASSWORD: land_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: land-record-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  minio:
    image: minio/minio:latest
    container_name: land-record-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


volumes:
  postgres_data:
  redis_data:
  minio_data: